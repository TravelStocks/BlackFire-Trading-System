<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>龙头战法复盘 | 5分K节点标注</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171713;
      --muted: #68645d;
      --paper: #f4f1ea;
      --panel: #fffdf7;
      --line: rgba(23, 23, 19, 0.14);
      --line-strong: rgba(23, 23, 19, 0.28);
      --red: #d43f2f;
      --red-soft: rgba(212, 63, 47, 0.12);
      --green: #0e8b68;
      --green-soft: rgba(14, 139, 104, 0.12);
      --amber: #d6a928;
      --amber-soft: rgba(214, 169, 40, 0.14);
      --blue: #2f5d9b;
      --blue-soft: rgba(47, 93, 155, 0.12);
      --black: #11110f;
      --white: #ffffff;
      --shadow: 0 18px 48px rgba(24, 21, 16, 0.12);
      --mono: "Cascadia Mono", "Consolas", monospace;
      --song: "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
      --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(17, 17, 15, 0.055) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(0deg, rgba(17, 17, 15, 0.045) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--paper);
      font-family: var(--sans);
      letter-spacing: 0;
      overflow-x: hidden;
      -webkit-tap-highlight-color: rgba(212, 63, 47, 0.18);
    }

    a { color: inherit; text-underline-offset: 4px; }
    :focus-visible { outline: 3px solid rgba(47, 93, 155, 0.72); outline-offset: 3px; }
    .skip-link {
      position: fixed;
      left: 18px;
      top: 12px;
      z-index: 50;
      transform: translateY(-140%);
      padding: 10px 14px;
      color: var(--white);
      background: var(--black);
      border-radius: 6px;
      transition: transform 160ms ease;
    }
    .skip-link:focus-visible { transform: translateY(0); }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 22px;
      align-items: center;
      min-height: 64px;
      padding: 0 max(18px, 4vw);
      color: var(--white);
      background: rgba(17, 17, 15, 0.94);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      color: var(--black);
      background: var(--amber);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 13px;
    }
    .nav {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .nav a {
      flex: 0 0 auto;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      text-decoration: none;
      border-bottom: 2px solid transparent;
    }
    .nav a:hover { color: var(--white); border-bottom-color: var(--amber); }

    .workbench, .section-wrap { padding: 24px max(16px, 4vw); }
    .section-inner { max-width: 1180px; margin: 0 auto; }
    .board {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, .75fr);
      gap: 18px;
      align-items: stretch;
    }
    .thesis, .panel, .chart-shell, .mini-card {
      background: rgba(255, 253, 247, 0.96);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .thesis { padding: clamp(22px, 4vw, 42px); }
    .panel { padding: 22px; }
    .eyebrow, .label {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid rgba(47, 93, 155, 0.18);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      max-width: 900px;
      margin-bottom: 18px;
      font-family: var(--song);
      font-size: clamp(28px, 4.2vw, 44px);
      line-height: 1.16;
      letter-spacing: 0;
    }
    h2 {
      margin: 10px 0 10px;
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.25;
      letter-spacing: 0;
    }
    h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.35; }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }
    .thesis > p:not(.eyebrow) { max-width: 780px; font-size: 16px; }

    .hero-metrics, .node-grid, .decision, .logic-grid {
      display: grid;
      gap: 10px;
    }
    .hero-metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 28px;
    }
    .metric, .node, .decision article, .logic-card {
      min-width: 0;
      padding: 14px;
      background: rgba(255, 255, 255, 0.64);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .metric span, .node span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
    }
    .metric strong, .node b {
      display: block;
      font-size: 16px;
      line-height: 1.38;
    }
    .node p, .decision p, .logic-card p { margin: 8px 0 0; font-size: 13px; line-height: 1.55; }
    .node.build { border-color: rgba(47, 93, 155, 0.36); background: var(--blue-soft); }
    .node.add { border-color: rgba(212, 63, 47, 0.32); background: var(--red-soft); }
    .node.reduce { border-color: rgba(214, 169, 40, 0.38); background: var(--amber-soft); }
    .node.clear { border-color: rgba(14, 139, 104, 0.34); background: var(--green-soft); }

    .chart-shell, .mini-card { overflow: hidden; }
    .chart-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      padding: 20px 22px 12px;
      border-bottom: 1px solid var(--line);
    }
    .chart-head p { margin-bottom: 0; }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      min-width: 210px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 0 10px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--black);
    }
    .legend-dot.build { background: var(--blue); }
    .legend-dot.add { background: var(--red); }
    .legend-dot.reduce { background: var(--amber); }
    .legend-dot.clear { background: var(--green); }
    .chart-body { padding: 14px; overflow-x: auto; }
    .k-chart {
      display: block;
      width: 100%;
      min-width: 720px;
      height: auto;
      background:
        linear-gradient(90deg, rgba(17, 17, 15, 0.045) 1px, transparent 1px) 0 0 / 38px 38px,
        linear-gradient(0deg, rgba(17, 17, 15, 0.04) 1px, transparent 1px) 0 0 / 38px 38px,
        #fffaf0;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .m5-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .mini-card .k-chart { min-width: 560px; }
    .decision {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding: 0 14px 16px;
    }
    .logic-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .chart-note {
      margin: 0;
      padding: 0 22px 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      line-height: 1.6;
    }
    th {
      color: var(--ink);
      background: rgba(17, 17, 15, 0.06);
      font-weight: 700;
    }
    tr:last-child td { border-bottom: 0; }

    .grid { stroke: rgba(23, 23, 19, 0.12); stroke-width: 1; }
    .axis { stroke: rgba(23, 23, 19, 0.28); stroke-width: 1.2; }
    .axis-text { fill: rgba(23, 23, 19, 0.62); font: 12px var(--mono); }
    .wick.up, .candle.up { stroke: var(--red); fill: var(--red-soft); }
    .wick.down, .candle.down { stroke: var(--green); fill: var(--green-soft); }
    .wick { stroke-width: 2; }
    .candle { stroke-width: 2; rx: 2; }
    .volume { fill: rgba(47, 93, 155, 0.18); }
    .price-line { fill: none; stroke: rgba(17, 17, 15, 0.82); stroke-width: 2.2; }
    .action-label text { fill: var(--white); font: 700 13px var(--sans); }
    .action-line { stroke-width: 2; stroke-dasharray: 4 4; }

    .empty {
      min-height: 60vh;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .skip-link { transition: none; }
    }

    @media (max-width: 980px) {
      .topbar { grid-template-columns: 1fr; gap: 0; padding-top: 8px; }
      .nav { justify-content: flex-start; }
      .board, .m5-grid, .logic-grid { grid-template-columns: 1fr; }
      .hero-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chart-head { flex-direction: column; }
      .chart-legend { justify-content: flex-start; min-width: 0; }
    }

    @media (max-width: 640px) {
      .workbench, .section-wrap { padding: 16px 12px; }
      .thesis, .panel { padding: 18px; }
      .hero-metrics, .decision { grid-template-columns: 1fr; }
      .brand { white-space: normal; }
      .nav a { padding: 0 10px; }
      .k-chart { min-width: 660px; }
      .mini-card .k-chart { min-width: 540px; }
    }
  </style>
</head>

        ];
      }
      if (action === "reduce") {
        return [
          { date: "09:30", open: 11.30, high: 11.60, low: 11.08, close: 11.48, volume: 44 },
          { date: "10:00", open: 11.48, high: 11.62, low: 11.18, close: 11.30, volume: 52, action, actionText: actionNames[action] },
          { date: "11:00", open: 11.30, high: 11.56, low: 11.12, close: 11.50, volume: 38 },
          { date: "13:30", open: 11.50, high: 11.60, low: 11.08, close: 11.22, volume: 56, action, actionText: "再减" },
          { date: "14:45", open: 11.22, high: 11.34, low: 10.95, close: 11.06, volume: 64 }
        ];
      }
      return [
        { date: "09:30", open: 11.20, high: 11.38, low: 10.78, close: 10.92, volume: 66 },
        { date: "10:00", open: 10.92, high: 11.04, low: 10.48, close: 10.56, volume: 82, action, actionText: actionNames[action] },
        { date: "11:00", open: 10.56, high: 10.72, low: 10.22, close: 10.34, volume: 58 },
        { date: "13:30", open: 10.34, high: 10.58, low: 10.06, close: 10.18, volume: 74 },
        { date: "14:45", open: 10.18, high: 10.30, low: 9.92, close: 10.02, volume: 62 }
      ];
    }

    function renderKChart(id, bars, options = {}) {
      const svg = document.getElementById(id);
      if (!svg) return;
      const width = options.width || 1120;
      const height = options.height || 430;
      const pad = options.pad || { left: 58, right: 28, top: 28, bottom: 76 };
      const maxVolHeight = options.maxVolHeight || 72;
      const prices = bars.flatMap((d) => [d.open, d.high, d.low, d.close]);
      const max = Math.max(...prices) * 1.025;
      const min = Math.min(...prices) * 0.975;
      const volMax = Math.max(...bars.map((d) => d.volume || 0), 1);
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const plotH = innerH - maxVolHeight - 18;
      const step = innerW / bars.length;
      const bodyW = Math.max(12, Math.min(34, step * 0.42));
      const x = (i) => pad.left + step * i + step / 2;
      const y = (v) => pad.top + (1 - (v - min) / (max - min)) * plotH;
      const volBase = pad.top + plotH + 18 + maxVolHeight;
      const grid = [0, .25, .5, .75, 1].map((t) => {
        const gy = pad.top + t * plotH;
        const val = max - t * (max - min);
        return `<line class="grid" x1="${pad.left}" y1="${gy}" x2="${width - pad.right}" y2="${gy}" /><text class="axis-text" x="10" y="${gy + 4}">${val.toFixed(2)}</text>`;
      }).join("");
      const candles = bars.map((d, i) => {
        const cx = x(i);
        const up = d.close >= d.open;
        const cls = up ? "up" : "down";
        const top = y(Math.max(d.open, d.close));
        const bottom = y(Math.min(d.open, d.close));
        const h = Math.max(3, bottom - top);
        const vh = ((d.volume || 0) / volMax) * maxVolHeight;
        const action = d.action ? actionLabel(cx, Math.min(y(d.high) - 34, top - 30), d.action, d.actionText || "") : "";
        return `
          <line class="wick ${cls}" x1="${cx}" y1="${y(d.high)}" x2="${cx}" y2="${y(d.low)}" />
          <rect class="candle ${cls}" x="${cx - bodyW / 2}" y="${top}" width="${bodyW}" height="${h}" />
          <rect class="volume" x="${cx - bodyW / 2}" y="${volBase - vh}" width="${bodyW}" height="${vh}" />
          <text class="axis-text" x="${cx}" y="${height - pad.bottom + 24}" text-anchor="middle">${d.date}</text>
          ${d.label ? `<text class="axis-text" x="${cx}" y="${height - pad.bottom + 42}" text-anchor="middle">${d.label}</text>` : ""}
          ${action}
        `;
      }).join("");
      const linePath = bars.map((d, i) => `${i ? "L" : "M"}${x(i)} ${y(d.close)}`).join(" ");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.innerHTML = `
        <rect x="0" y="0" width="${width}" height="${height}" fill="transparent" />
        ${grid}
        <line class="axis" x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" />
        <path class="price-line" d="${linePath}" opacity=".22" />
        ${candles}
      `;
    }

    function actionLabel(cx, cy, action, text) {
      const color = colors[action] || "#11110f";
      const w = Math.max(48, text.length * 14 + 18);
      return `
        <g class="action-label">
          <line class="action-line" x1="${cx}" y1="${cy + 24}" x2="${cx}" y2="${cy + 52}" stroke="${color}" />
          <rect x="${cx - w / 2}" y="${Math.max(4, cy)}" width="${w}" height="26" fill="${color}" />
          <text x="${cx}" y="${Math.max(4, cy) + 18}" text-anchor="middle">${text}</text>
        </g>
      `;
    }

    renderKChart("daily-chart", toBars(review.daily));
    review.phases.forEach((phase, index) => {
      const action = phase[1];
      renderKChart(`m5-${action}-chart-${index}`, m5Pattern(action), {
        width: 640,
        height: 300,
        pad: { left: 48, right: 24, top: 28, bottom: 66 },
        maxVolHeight: 52
      });
    });
  </script>
</body>
